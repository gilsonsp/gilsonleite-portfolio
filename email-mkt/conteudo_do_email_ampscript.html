 %%[
VAR @nome, @saudacao, @produto

SET @nome = ProperCase(Trim(AttributeValue("PrimeiroNome")))
SET @produto = AttributeValue("Produto")

IF Empty(@nome) THEN
    SET @saudacao = "Olá!"
ELSE
    SET @saudacao = Concat("Olá, ", @nome, "!")
ENDIF
]%%
